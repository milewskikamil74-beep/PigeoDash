name: Build PigeoDash Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install customtkinter pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --name PigeoDash PigoDash.py

      - uses: actions/upload-artifact@v4
        with:
          name: PigeoDash-Windows
          path: dist/PigeoDash.exe
